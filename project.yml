name: SwiftCode

options:
  bundleIdPrefix: com.swiftcode
  defaultConfig: Release
  deploymentTarget:
    macOS: "15.0"
  xcodeVersion: "16.0"
  generateEmptyDirectories: true

settings:
  base:
    MARKETING_VERSION: "3.2"
    CURRENT_PROJECT_VERSION: "3.2"
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "15.0"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_IDENTITY: ""
    CODE_SIGNING_REQUIRED: "NO"
    CODE_SIGNING_ALLOWED: "NO"
    SWIFT_ENABLE_EXPLICIT_MODULES: "NO"
    SWIFT_INCLUDE_PATHS:
      - "$(BUILD_DIR)/../../SourcePackages/checkouts/swift-syntax/Sources/_SwiftSyntaxCShims/include"
      - "$(BUILD_DIR)/../../SourcePackages/checkouts/swift-markdown/Sources/CAtomic/include"
      - "$(BUILD_DIR)/../../SourcePackages/checkouts/swift-cmark/src/include"
      - "$(BUILD_DIR)/../../SourcePackages/checkouts/swift-cmark/extensions/include"
      - "$(BUILD_DIR)/../../SourcePackages/checkouts/swift-subprocess/Sources/_SubprocessCShims/include"
    HEADER_SEARCH_PATHS:
      - "$(BUILD_DIR)/../../SourcePackages/checkouts/swift-syntax/Sources/_SwiftSyntaxCShims/include"
      - "$(BUILD_DIR)/../../SourcePackages/checkouts/swift-markdown/Sources/CAtomic/include"
      - "$(BUILD_DIR)/../../SourcePackages/checkouts/swift-cmark/src/include"
      - "$(BUILD_DIR)/../../SourcePackages/checkouts/swift-subprocess/Sources/_SubprocessCShims/include"
      - "$(BUILD_DIR)/../../SourcePackages/checkouts/swift-cmark/extensions/include"
    OTHER_SWIFT_FLAGS:
      - "$(inherited)"
      - "-package-name"
      - "SwiftCode"
      # Clang modules vendored by package C targets are not always passed to
      # client Swift targets; point the importer at Xcode's generated maps.
      - "-Xcc"
      - "-fmodule-map-file=$(OBJROOT)/GeneratedModuleMaps/TreeSitter.modulemap"
      - "-Xcc"
      - "-fmodule-map-file=$(OBJROOT)/GeneratedModuleMaps/TreeSitterC.modulemap"
      - "-Xcc"
      - "-fmodule-map-file=$(OBJROOT)/GeneratedModuleMaps/TreeSitterCPP.modulemap"
      - "-Xcc"
      - "-fmodule-map-file=$(OBJROOT)/GeneratedModuleMaps/TreeSitterGo.modulemap"
      - "-Xcc"
      - "-fmodule-map-file=$(OBJROOT)/GeneratedModuleMaps/TreeSitterJava.modulemap"
      - "-Xcc"
      - "-fmodule-map-file=$(OBJROOT)/GeneratedModuleMaps/TreeSitterJavaScript.modulemap"
      - "-Xcc"
      - "-fmodule-map-file=$(OBJROOT)/GeneratedModuleMaps/TreeSitterPython.modulemap"
      - "-Xcc"
      - "-fmodule-map-file=$(OBJROOT)/GeneratedModuleMaps/TreeSitterRust.modulemap"
      - "-Xcc"
      - "-fmodule-map-file=$(OBJROOT)/GeneratedModuleMaps/TreeSitterCSharp.modulemap"

packages:
  ZIPFoundation:
    url: https://github.com/weichsel/ZIPFoundation.git
    from: 0.9.0
  Splash:
    url: https://github.com/JohnSundell/Splash.git
    from: 0.16.0
  SwiftMarkdown:
    url: https://github.com/apple/swift-markdown.git
    from: 0.5.0
  SwiftCrypto:
    url: https://github.com/apple/swift-crypto.git
    exactVersion: 4.5.2
  SwiftSyntax:
    url: https://github.com/swiftlang/swift-syntax.git
    exactVersion: 604.0.0
  SwiftSubprocess:
    url: https://github.com/swiftlang/swift-subprocess.git
    exactVersion: 1.0.2
  SwiftTreeSitter:
    url: https://github.com/tree-sitter/swift-tree-sitter.git
    exactVersion: 0.10.0
  TreeSitterC:
    url: https://github.com/tree-sitter/tree-sitter-c.git
    from: 0.16.0
  TreeSitterCPP:
    url: https://github.com/tree-sitter/tree-sitter-cpp.git
    branch: master
  TreeSitterGo:
    url: https://github.com/tree-sitter/tree-sitter-go.git
    branch: master
  TreeSitterJavaScript:
    url: https://github.com/tree-sitter/tree-sitter-javascript.git
    exactVersion: 0.23.1
  TreeSitterPython:
    url: https://github.com/tree-sitter/tree-sitter-python.git
    exactVersion: 0.23.6
  TreeSitterRust:
    url: https://github.com/tree-sitter/tree-sitter-rust.git
    branch: master
  TreeSitterJava:
    url: https://github.com/tree-sitter/tree-sitter-java.git
    branch: master
  TreeSitterCSharp:
    url: https://github.com/tree-sitter/tree-sitter-c-sharp.git
    branch: master
  LanguageServerProtocol:
    url: https://github.com/ChimeHQ/LanguageServerProtocol.git
    from: 0.14.0
  LanguageClient:
    url: https://github.com/ChimeHQ/LanguageClient.git
    revision: 211384c40e960d5bc12d3fd8f2ada318541d6a24
  StoreKit:
    path: frameworks/storekit

